services:
  api:
    build:
      context: .
      dockerfile: studio_backend/Dockerfile
    command: sh -c "alembic upgrade head && uvicorn studio_backend.app:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://studio:studio@postgres:5432/studio
      REDIS_URL: redis://redis:6379/0
      STUDIO_ADMIN_TOKEN: ${STUDIO_ADMIN_TOKEN:-dev-token}
      STUDIO_CORS_ORIGINS: http://localhost:3000
      STUDIO_OBJECT_STORE_ENDPOINT: http://minio:9000
      STUDIO_OBJECT_STORE_ACCESS_KEY_ID: minioadmin
      STUDIO_OBJECT_STORE_SECRET_ACCESS_KEY: minioadmin
      STUDIO_OBJECT_STORE_BUCKET: datadesigner-studio
    ports:
      - "8000:8000"
    volumes:
      - studio-artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: studio_backend/Dockerfile
    command: celery -A studio_backend.tasks.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://studio:studio@postgres:5432/studio
      REDIS_URL: redis://redis:6379/0
      STUDIO_ADMIN_TOKEN: ${STUDIO_ADMIN_TOKEN:-dev-token}
      STUDIO_OBJECT_STORE_ENDPOINT: http://minio:9000
      STUDIO_OBJECT_STORE_ACCESS_KEY_ID: minioadmin
      STUDIO_OBJECT_STORE_SECRET_ACCESS_KEY: minioadmin
      STUDIO_OBJECT_STORE_BUCKET: datadesigner-studio
    volumes:
      - studio-artifacts:/app/artifacts
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: studio_frontend
      dockerfile: Dockerfile
    environment:
      STUDIO_API_BASE: http://api:8000
      STUDIO_ADMIN_TOKEN: ${STUDIO_ADMIN_TOKEN:-dev-token}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "5432:5432"
    volumes:
      - studio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - studio-minio:/data

volumes:
  studio-artifacts:
  studio-postgres:
  studio-minio:
